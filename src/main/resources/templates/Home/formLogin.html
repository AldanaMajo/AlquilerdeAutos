<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comercial de Autos - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Login.css" th:href="@{/css/Login.css}">
</head>
<body>

<div class="login-wrapper">
    <div class="row g-0">

        <div class="col-lg-6 hero-section">
            <div class="brand-logo">
                <i class="fas fa-car-alt text-white"></i>
                <span>Alquiler de Autos</span>
            </div>

            <div class="hero-content">
                <h1>Bienvenido<br><span>de nuevo</span></h1>
                <p>Inicia sesión para continuar gestionando tu negocio.</p>
            </div>

            <div class="security-badge">

            </div>
        </div>

        <div class="col-lg-6 form-section">
            <div>
                <h2 class="form-title">Iniciar Sesión</h2>
                <p class="form-subtitle">Ingresa tus credenciales para acceder</p>

                <!-- Alertas de Thymeleaf -->
                <div th:if="${param.error}" class="alert alert-custom-error py-2 px-3 mb-3" role="alert">
                    <i class="fas fa-exclamation-circle me-1"></i> Usuario o contraseña incorrectos.
                </div>
                <div th:if="${param.logout}" class="alert alert-custom-logout py-2 px-3 mb-3" role="alert">
                    <i class="fas fa-info-circle me-1"></i> Has cerrado sesión correctamente.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="custom-label">Usuario</label>
                        <div class="input-box">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="username" name="username" class="custom-input" placeholder="Ingresa tu usuario" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="custom-label">Contraseña</label>
                        <div class="input-box">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" name="password" class="custom-input" placeholder="Ingresa tu contraseña" required>
                            <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility()"></i>
                        </div>
                    </div>

                    <div class="form-options">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember-me">
                            <label class="form-check-label" for="remember">Recordarme</label>
                        </div>
                        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn btn-submit">Iniciar Sesión</button>
                </form>
            </div>

            <div class="copyright text-center text-lg-start">
                © 2026 <strong>Alquiler de Autos</strong>. Todos los derechos reservados.
            </div>
        </div>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const icon = document.querySelector('.toggle-password');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
