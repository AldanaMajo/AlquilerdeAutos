<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/Layout/Layout-Admin">

<div layout:fragment="content">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center my-4 gap-3">
        <div>
            <h1 class="mt-2 h2 fw-bold text-dark" th:text="${reserva.id == null ? 'Nueva Reserva' : 'Editar Reserva'}">Registro de Reserva</h1>
            <p class="text-muted mb-0">Ingresa los datos requeridos para gestionar el alquiler</p>
        </div>
        <a th:href="@{/reservas}" class="btn btn-outline-secondary rounded-pill px-4 py-2 d-flex align-items-center gap-2">
            <i class="fas fa-arrow-left"></i>
            Volver al listado
        </a>
    </div>

    <div class="card bg-dark text-white border-0 rounded-3 shadow-sm mb-4">
        <div class="card-header bg-dark bg-opacity-50 border-bottom border-white border-opacity-10 p-3">
            <h5 class="mb-0 text-white">Datos de la Reserva</h5>
        </div>

        <div class="card-body p-4">
            <form th:action="@{/reservas/guardar}" th:object="${reserva}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}" />

                <div class="col-12 col-md-6" th:if="${reserva.id != null}">
                    <label class="form-label text-white-50">Código de Reserva</label>
                    <input type="text" th:field="*{codigoReserva}" class="form-control bg-dark text-white border-secondary" readonly />
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label text-white-50">Precio Diario Acordado ($)</label>
                    <input type="number" step="0.01" th:field="*{precio_diario_acordado}" class="form-control bg-dark text-white border-secondary" placeholder="Ej: 45.00" required />
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label text-white-50">Fecha de Inicio</label>
                    <input type="date" th:field="*{fecha_inicio}" class="form-control bg-dark text-white border-secondary" required />
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label text-white-50">Fecha de Fin</label>
                    <input type="date" th:field="*{fecha_fin}" class="form-control bg-dark text-white border-secondary" required />
                </div>

                <div class="col-12 col-md-6" th:if="${reserva.id != null}">
                    <label class="form-label text-white-50">Estado</label>
                    <select th:field="*{estado}" class="form-select bg-dark text-white border-secondary">
                        <option th:each="est : ${estados}" th:value="${est}" th:text="${est}"></option>
                    </select>
                </div>

                <div class="col-12 d-flex justify-content-end gap-2 mt-4 pt-3 border-top border-white border-opacity-10">
                    <a th:href="@{/reservas}" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4 font-weight-bold">
                        <i class="fas fa-save me-1"></i> Guardar Reserva
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
</html>
