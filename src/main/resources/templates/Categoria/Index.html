<!DOCTYPE html>
<html lang="es"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{Layout/Layout-Admin}">

<div layout:fragment="content">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center my-4 gap-3">
        <div>
            <h2 class="fw-bold text-dark mb-1">Gestión de Categorías</h2>
        </div>

        <button type="button"
                class="btn btn-primary px-3 py-2 rounded-3 fw-semibold shadow-sm"
                style="background-color: #4f46e5; border: none;"
                data-bs-toggle="modal"
                data-bs-target="#modalNuevaCategoria">
            <i class="fas fa-plus me-1"></i> Nueva Categoría
        </button>
    </div>


    <!-- MENSAJES -->

    <div th:if="${errorDuplicado}"
         class="alert alert-warning alert-dismissible fade show"
         role="alert">
        <strong>Advertencia:</strong>
        <span th:text="${errorDuplicado}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>
    </div>

    <div th:if="${exito}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">
        <strong>Éxito:</strong>
        <span th:text="${exito}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>
    </div>


    <div class="card border-0 shadow-sm rounded-3 overflow-hidden mb-4">

        <!-- BUSCADOR -->

        <form th:action="@{/Categoria/Index}"
              method="get"
              class="p-3 bg-white border-bottom m-0">

            <div class="input-group" style="max-width: 320px;">

                <span class="input-group-text bg-light border-end-0 text-muted">
                    <i class="fas fa-search"></i>
                </span>

                <input type="text"
                       name="buscar"
                       th:value="${buscar}"
                       class="form-control bg-light border-start-0 ps-0 text-secondary"
                       placeholder="Buscar categorías..."
                       style="box-shadow: none;">

                <button type="submit" class="d-none"></button>

            </div>

        </form>


        <!-- TABLA -->

        <div class="table-responsive tb-bg-index">

            <table class="table align-middle mb-0 text-secondary tabla-b"
                   style="font-size: 0.9rem;">

                <thead class="bg-light text-uppercase fw-bold text-muted border-bottom"
                       style="font-size: 0.75rem; letter-spacing: 0.5px;">

                <tr>
                    <th class="py-3 px-4">ID</th>
                    <th class="py-3 px-4">Nombre de Categoría</th>
                    <th class="py-3 px-4">Tarifa Base Diaria</th>
                    <th class="py-3 px-4 text-center">Acciones</th>
                </tr>

                </thead>


                <tbody class="bg-white">

                <tr class="border-bottom"
                    th:each="cat : ${categorias}">

                    <!-- ID -->

                    <td class="py-3 px-4"
                        th:text="${cat.id}">
                        1
                    </td>


                    <!-- NOMBRE -->

                    <td class="py-3 px-4">

                        <div class="d-flex align-items-center gap-3">

                            <div class="rounded-circle d-flex align-items-center justify-content-center"
                                 style="width: 36px;
                                        height: 36px;
                                        background-color: #eef2ff;
                                        color: #4f46e5;">

                                <i class="fas fa-tags"></i>

                            </div>

                            <span class="fw-bold text-dark"
                                  th:text="${cat.nombre}">
                                Sedán
                            </span>

                        </div>

                    </td>


                    <!-- TARIFA -->

                    <td class="py-3 px-4 fw-semibold text-dark"
                        th:text="${'$' + cat.tarifaBaseDiaria}">
                        $50.00
                    </td>


                    <!-- ACCIONES -->

                    <td class="py-3 px-4 text-center">

                        <!-- EDITAR -->

                        <button type="button"
                                class="btn btn-link text-primary p-0 border-0 me-2"
                                title="Editar"
                                data-bs-toggle="modal"
                                data-bs-target="#modalEditarCategoria"

                                th:data-id="${cat.id}"
                                th:data-nombre="${cat.nombre}"
                                th:data-tarifa="${cat.tarifaBaseDiaria}">

                            <i class="fas fa-pen"></i>

                        </button>


                        <!-- ELIMINAR -->

                        <button type="button"
                                class="btn btn-link text-danger p-0 border-0"
                                title="Eliminar"
                                data-bs-toggle="modal"
                                data-bs-target="#modalEliminarCategoria"

                                th:data-id="${cat.id}"
                                th:data-nombre="${cat.nombre}">

                            <i class="fas fa-trash"></i>

                        </button>

                    </td>

                </tr>


                <!-- SIN CATEGORÍAS -->

                <tr th:if="${#lists.isEmpty(categorias)}">

                    <td colspan="4"
                        class="text-center py-4 text-muted">

                        No se encontraron categorías registradas.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>


        <!-- PIE -->

        <div class="p-3 bg-white d-flex justify-content-between align-items-center text-muted small">

            <span>

                Mostrando

                <strong th:text="${#lists.size(categorias)}">
                    0
                </strong>

                categorías

            </span>

            <div class="d-flex gap-2">

                <button class="btn btn-sm btn-link text-muted p-0 text-decoration-none"
                        disabled>

                    <i class="fas fa-chevron-left"></i>

                </button>

                <button class="btn btn-sm btn-link text-muted p-0 text-decoration-none"
                        disabled>

                    <i class="fas fa-chevron-right"></i>

                </button>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- MODAL NUEVA CATEGORÍA -->
    <!-- ===================================================== -->

    <div class="modal fade"
         id="modalNuevaCategoria"
         tabindex="-1"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content border-0 shadow">

                <div class="modal-header border-bottom-0 pb-0">

                    <h5 class="modal-title fw-bold text-dark">
                        Nueva Categoría
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>

                </div>


                <form th:action="@{/Categoria/Guardar}"
                      th:object="${nuevaCategoria}"
                      method="post">

                    <!-- CSRF -->

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">


                    <div class="modal-body py-4">

                        <!-- NOMBRE -->

                        <div class="mb-3">

                            <label for="nombreNuevo"
                                   class="form-label fw-semibold text-secondary small">

                                Nombre de la Categoría

                            </label>

                            <input type="text"
                                   id="nombreNuevo"

                                   th:field="*{nombre}"

                                   class="form-control"

                                   placeholder="Ej: SUV, Sedán, Deportivo"

                                   required>

                        </div>


                        <!-- TARIFA -->

                        <div class="mb-3">

                            <label for="tarifaNueva"
                                   class="form-label fw-semibold text-secondary small">

                                Tarifa Base Diaria ($)

                            </label>

                            <input type="number"
                                   step="0.01"
                                   min="0.01"
                                   id="tarifaNueva"

                                   th:field="*{tarifaBaseDiaria}"

                                   class="form-control"

                                   placeholder="0.00"

                                   required>

                        </div>

                    </div>


                    <div class="modal-footer border-top-0 pt-0">

                        <button type="button"
                                class="btn btn-light px-3 fw-semibold"
                                data-bs-dismiss="modal">

                            Cancelar

                        </button>

                        <button type="submit"
                                class="btn btn-primary px-3 fw-semibold"
                                style="background-color: #4f46e5; border: none;">

                            Guardar

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- MODAL EDITAR -->
    <!-- ===================================================== -->

    <div class="modal fade"
         id="modalEditarCategoria"
         tabindex="-1"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content border-0 shadow">

                <div class="modal-header border-bottom-0 pb-0">

                    <h5 class="modal-title fw-bold text-dark">
                        Editar Categoría
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>

                </div>


                <form th:action="@{/Categoria/Editar}"
                      method="post">

                    <!-- CSRF -->

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">


                    <div class="modal-body py-4">

                        <!-- ID -->

                        <input type="hidden"
                               id="editarId"
                               name="id">


                        <!-- NOMBRE -->

                        <div class="mb-3">

                            <label for="editarNombre"
                                   class="form-label fw-semibold text-secondary small">

                                Nombre de la Categoría

                            </label>

                            <input type="text"
                                   id="editarNombre"
                                   name="nombre"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- TARIFA -->

                        <div class="mb-3">

                            <label for="editarTarifa"
                                   class="form-label fw-semibold text-secondary small">

                                Tarifa Base Diaria ($)

                            </label>

                            <input type="number"
                                   step="0.01"
                                   min="0.01"

                                   id="editarTarifa"

                                   name="tarifaBaseDiaria"

                                   class="form-control"

                                   required>

                        </div>

                    </div>


                    <div class="modal-footer border-top-0 pt-0">

                        <button type="button"
                                class="btn btn-light px-3 fw-semibold"
                                data-bs-dismiss="modal">

                            Cancelar

                        </button>

                        <button type="submit"
                                class="btn btn-primary px-3 fw-semibold"
                                style="background-color: #4f46e5; border: none;">

                            Actualizar

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- MODAL ELIMINAR -->
    <!-- ===================================================== -->

    <div class="modal fade"
         id="modalEliminarCategoria"
         tabindex="-1"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content border-0 shadow">

                <div class="modal-header border-bottom-0 pb-0">

                    <h5 class="modal-title fw-bold text-dark">
                        Confirmar Eliminación
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>

                </div>


                <div class="modal-body py-4">

                    <p class="text-secondary mb-0">

                        ¿Estás seguro de que deseas eliminar la categoría

                        <strong id="eliminarNombre"
                                class="text-dark">
                        </strong>?

                    </p>

                </div>


                <div class="modal-footer border-top-0 pt-0">

                    <button type="button"
                            class="btn btn-light px-3 fw-semibold"
                            data-bs-dismiss="modal">

                        Cancelar

                    </button>

                    <a id="btnConfirmarEliminar"
                       href="#"
                       class="btn btn-danger px-3 fw-semibold">

                        Eliminar

                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- JAVASCRIPT -->
    <!-- ===================================================== -->

    <script>

        document.addEventListener('DOMContentLoaded', function () {

            // ==============================
            // MODAL EDITAR
            // ==============================

            const modalEditar =
                document.getElementById('modalEditarCategoria');

            if (modalEditar) {

                modalEditar.addEventListener(
                    'show.bs.modal',
                    function (event) {

                        const button = event.relatedTarget;

                        const id =
                            button.getAttribute('data-id');

                        const nombre =
                            button.getAttribute('data-nombre');

                        const tarifa =
                            button.getAttribute('data-tarifa');


                        document.getElementById(
                            'editarId'
                        ).value = id;


                        document.getElementById(
                            'editarNombre'
                        ).value = nombre;


                        document.getElementById(
                            'editarTarifa'
                        ).value = tarifa;

                    }
                );

            }


            // ==============================
            // MODAL ELIMINAR
            // ==============================

            const modalEliminar =
                document.getElementById('modalEliminarCategoria');

            if (modalEliminar) {

                modalEliminar.addEventListener(
                    'show.bs.modal',
                    function (event) {

                        const button = event.relatedTarget;

                        const id =
                            button.getAttribute('data-id');

                        const nombre =
                            button.getAttribute('data-nombre');


                        document.getElementById(
                            'eliminarNombre'
                        ).textContent = nombre;


                        document.getElementById(
                            'btnConfirmarEliminar'
                        ).href =
                            '/Categoria/Eliminar/' + id;

                    }
                );

            }

        });

    </script>


    <!-- ===================================================== -->
    <!-- SWEET ALERT -->
    <!-- ===================================================== -->

    <script th:inline="javascript">

        document.addEventListener('DOMContentLoaded', function () {

            const errorDuplicado =
                /*[[${errorDuplicado}]]*/ null;

            const exito =
                /*[[${exito}]]*/ null;


            if (errorDuplicado) {

                Swal.fire({

                    icon: 'warning',

                    title: 'Nombre Duplicado',

                    text: errorDuplicado,

                    confirmButtonColor: '#4f46e5'

                });

            }


            if (exito) {

                Swal.fire({

                    icon: 'success',

                    title: 'Operación Exitosa',

                    text: exito,

                    timer: 2000,

                    showConfirmButton: false

                });

            }

        });

    </script>

</div>

</html>
