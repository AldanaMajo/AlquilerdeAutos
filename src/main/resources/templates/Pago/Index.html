<html lang="es"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{Layout/Layout-Admin}">

<div layout:fragment="content">

    <!-- Encabezado de Página -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center my-4 gap-3">
        <div>
            <h2 class="fw-bold text-dark mb-1">Gestión de Pagos</h2>
        </div>
        <button type="button"
                class="btn btn-primary px-3 py-2 rounded-3 fw-semibold shadow-sm"
                style="background-color: #4f46e5; border: none;"
                data-bs-toggle="modal"
                data-bs-target="#modalNuevoPago">
            <i class="fas fa-plus me-1"></i> Registrar Pago
        </button>
    </div>

    <!-- Contenedor Principal / Tabla -->
    <div class="card border-0 shadow-sm rounded-3 overflow-hidden mb-4">

        <div class="table-responsive tb-bg-index">
            <table class="table align-middle mb-0 text-secondary tabla-b" style="font-size: 0.9rem;">
                <thead class="bg-light text-uppercase fw-bold text-muted border-bottom" style="font-size: 0.75rem; letter-spacing: 0.5px;">
                <tr>
                    <th class="py-3 px-4">ID</th>
                    <th class="py-3 px-4">Monto</th>
                    <th class="py-3 px-4">Método de Pago</th>
                    <th class="py-3 px-4">Fecha de Pago</th>
                    <th class="py-3 px-4">ID Alquiler</th>
                    <th class="py-3 px-4 text-center">Acciones</th>
                </tr>
                </thead>
                <tbody class="bg-white">
                <tr class="border-bottom" th:each="pago : ${pagos}">
                    <td class="py-3 px-4" th:text="${pago.id}">1</td>
                    <td class="py-3 px-4 fw-bold text-dark" th:text="${'$' + #numbers.formatDecimal(pago.monto, 1, 'POINT', 2, 'POINT')}">$0.00</td>
                    <td class="py-3 px-4">
                        <div class="d-flex align-items-center gap-2">
                            <div class="rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; background-color: #eef2ff; color: #4f46e5;">
                                <i class="fas fa-credit-card"></i>
                            </div>
                            <span class="fw-semibold text-dark" th:text="${pago.metodoPago}">EFECTIVO</span>
                        </div>
                    </td>
                    <td class="py-3 px-4" th:text="${#temporals.format(pago.fecha_pago, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
                    <td class="py-3 px-4">
                        <span class="badge bg-light text-dark border fw-normal px-2 py-1" th:text="${pago.alquiler != null ? 'Alquiler #' + pago.alquiler.id : 'Sin Alquiler'}">#1</span>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <!-- Botón Editar -->
                        <button class="btn btn-link text-primary p-0 border-0 me-2"
                                title="Editar"
                                data-bs-toggle="modal"
                                data-bs-target="#modalEditarPago"
                                th:data-id="${pago.id}"
                                th:data-monto="${pago.monto}"
                                th:data-metodo="${pago.metodoPago}"
                                th:data-idalquiler="${pago.alquiler != null ? pago.alquiler.id : ''}">
                            <i class="fas fa-pen"></i>
                        </button>
                        <!-- Botón Eliminar -->
                        <button class="btn btn-link text-danger p-0 border-0"
                                title="Eliminar"
                                data-bs-toggle="modal"
                                data-bs-target="#modalEliminarPago"
                                th:data-id="${pago.id}">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pagos)}">
                    <td colspan="6" class="text-center py-4 text-muted">
                        No se encontraron pagos registrados.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="p-3 bg-white d-flex justify-content-between align-items-center text-muted small">
            <span>
                Mostrando <strong th:text="${#lists.size(pagos)}">0</strong> pago(s)
            </span>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-link text-muted p-0 text-decoration-none" disabled><i class="fas fa-chevron-left"></i></button>
                <button class="btn btn-sm btn-link text-muted p-0 text-decoration-none" disabled><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

    </div>

    <!-- MODAL 1: NUEVO PAGO -->
    <div class="modal fade" id="modalNuevoPago" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark">Registrar Pago</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/Pago/Guardar}" th:object="${nuevoPago}" method="post">
                    <div class="modal-body py-4">
                        <div class="mb-3">
                            <label for="montoNuevo" class="form-label fw-semibold text-secondary small">Monto ($)</label>
                            <input type="number" step="0.01" id="montoNuevo" th:field="*{monto}" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="mb-3">
                            <label for="metodoNuevo" class="form-label fw-semibold text-secondary small">Método de Pago</label>
                            <select id="metodoNuevo" th:field="*{metodoPago}" class="form-select" required>
                                <option value="" disabled selected>Seleccione un método</option>
                                <option th:each="m : ${metodosPago}" th:value="${m}" th:text="${m}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="alquilerNuevo" class="form-label fw-semibold text-secondary small">Alquiler Asociado</label>
                            <select id="alquilerNuevo" th:field="*{alquiler.id}" class="form-select" required>
                                <option value="" disabled selected>Seleccione un Alquiler</option>
                                <option th:each="alq : ${alquileres}"
                                        th:value="${alq.id}"
                                        th:text="'Alquiler #' + ${alq.id}">
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 pt-0">
                        <button type="button" class="btn btn-light px-3 fw-semibold" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-3 fw-semibold" style="background-color: #4f46e5; border: none;">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL 2: EDITAR PAGO -->
    <div class="modal fade" id="modalEditarPago" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark">Editar Pago</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/Pago/Editar}" method="post">
                    <div class="modal-body py-4">
                        <input type="hidden" id="editarIdPago" name="id">

                        <div class="mb-3">
                            <label for="editarMontoPago" class="form-label fw-semibold text-secondary small">Monto ($)</label>
                            <input type="number" step="0.01" id="editarMontoPago" name="monto" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editarMetodoPago" class="form-label fw-semibold text-secondary small">Método de Pago</label>
                            <select id="editarMetodoPago" name="metodoPago" class="form-select" required>
                                <option th:each="m : ${metodosPago}" th:value="${m}" th:text="${m}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editarAlquilerPago" class="form-label fw-semibold text-secondary small">Alquiler Asociado</label>
                            <select id="editarAlquilerPago" name="alquiler.id" class="form-select" required>
                                <option th:each="alq : ${alquileres}"
                                        th:value="${alq.id}"
                                        th:text="'Alquiler #' + ${alq.id}">
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 pt-0">
                        <button type="button" class="btn btn-light px-3 fw-semibold" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-3 fw-semibold" style="background-color: #4f46e5; border: none;">Actualizar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL 3: CONFIRMAR ELIMINACIÓN -->
    <div class="modal fade" id="modalEliminarPago" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark">Confirmar Eliminación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-4">
                    <p class="text-secondary mb-0">¿Estás seguro de que deseas eliminar el registro de pago <strong id="eliminarPagoIdText" class="text-dark"></strong>?</p>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="button" class="btn btn-light px-3 fw-semibold" data-bs-dismiss="modal">Cancelar</button>
                    <a id="btnConfirmarEliminarPago" href="#" class="btn btn-danger px-3 fw-semibold">Eliminar</a>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT PARA CARGAR DATOS DINÁMICOS EN LOS MODALES -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Cargar datos en Modal Editar
            const modalEditar = document.getElementById('modalEditarPago');
            if (modalEditar) {
                modalEditar.addEventListener('show.bs.modal', function (event) {
                    const button = event.relatedTarget;

                    document.getElementById('editarIdPago').value = button.getAttribute('data-id');
                    document.getElementById('editarMontoPago').value = button.getAttribute('data-monto');
                    document.getElementById('editarMetodoPago').value = button.getAttribute('data-metodo');
                    document.getElementById('editarAlquilerPago').value = button.getAttribute('data-idalquiler');
                });
            }

            // Cargar datos en Modal Eliminar
            const modalEliminar = document.getElementById('modalEliminarPago');
            if (modalEliminar) {
                modalEliminar.addEventListener('show.bs.modal', function (event) {
                    const button = event.relatedTarget;
                    const id = button.getAttribute('data-id');

                    document.getElementById('eliminarPagoIdText').textContent = '#' + id;
                    document.getElementById('btnConfirmarEliminarPago').href = '/Pago/Eliminar/' + id;
                });
            }
        });
    </script>

</div>
</html>
